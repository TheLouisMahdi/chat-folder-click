name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and protocol
        run: npm run check
      - name: Package Edge extension
        run: python3 scripts/package_edge.py
      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: chat-folder-click-edge-v2.1.0
          path: dist/chat-folder-click-edge-v2.1.0.zip
